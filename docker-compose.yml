services:
    client:
        build: ./client
        depends_on:
            - server
        env_file:
            - .env
        ports:
            - 3000:3000
        volumes:
            - /app/node_modules/
            - /app/.next/
    server:
        build: ./server
        env_file:
            - .env
        ports:
            - 3010:3010 # HTTP
            - 3020:3020 # WS
        volumes:
            - /app/node_modules/
